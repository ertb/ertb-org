version: '3.7'

services:
  # docker run -d -p 9000:9000 -p 9001:9001 quay.io/minio/minio server /data --console-address ":9001"
  minio:
    image: quay.io/minio/minio:RELEASE.2024-04-06T05-26-02Z
    container_name: minio
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - 9000:9000
      - 9001:9001

  createbucket:
    image: quay.io/minio/mc:RELEASE.2024-03-30T15-29-52Z
    container_name: mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/ertb-org;
      /usr/bin/mc policy set public myminio/ertb-org;
      exit 0;
      "

  # docker run -d -p 27017:27017 \
  # -v $(pwd)/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro \
  # mongodb/mongodb-community-server
  mongodb:
    image: quay.io/mongodb/mongodb-community-server:7.0-ubuntu2204
    container_name: mongodb
    restart: always
    ports:
      - 27017:27017
    volumes:
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

networks:
  services:
    name: ertb-org-network

